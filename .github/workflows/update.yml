name: Mega645 Auto Update
on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * *'
    - cron: '30 15 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python analyze.py
        env:
          MEGA645_CSV_URL: ${{ vars.MEGA645_CSV_URL }}
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ data/
          if ! git diff --cached --quiet; then
            git commit -m "Update Mega645 analysis"
            git push
          fi
